# Generated VPS deployment of 78e4ea7998139839fac51319e9dd7aa81325041c. Application source is embedded so the VPS needs no GitHub credential.
services:
  queue:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - queue:/data
    networks:
    - app
    mem_limit: 192m
    command:
    - redis-server
    - --appendonly
    - 'yes'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    logging: &id001
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  api:
    security_opt: &id002
    - no-new-privileges:true
    cap_drop: &id003
    - ALL
    init: true
    restart: unless-stopped
    logging: *id001
    build: &id004
      context: .
      dockerfile_inline: |
        FROM node:24-bookworm-slim AS node
        FROM python:3.12-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg ca-certificates && rm -rf /var/lib/apt/lists/*
        COPY --from=node /usr/local/bin/node /usr/local/bin/node
        RUN useradd --system --uid 10001 --create-home app && mkdir -p /data /srv && chown app:app /data
        WORKDIR /srv
        RUN echo '' | base64 -d | tar -xz -C /srv
        WORKDIR /srv/backend
        RUN pip install --no-cache-dir -r requirements.txt
        USER app
    image: linkdownloader-backend:78e4ea79
    pull_policy: build
    environment: &id008
      APP_ENV: production
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.db
      REDIS_URL: redis://queue:6379/0
      ALLOWED_ORIGINS: https://linkdownloader.org,https://www.linkdownloader.org
      SESSION_COOKIE_SECURE: 'true'
      USE_X_ACCEL_REDIRECT: 'false'
      YTDLP_JS_RUNTIMES: node
    volumes: &id005
    - media:/data
    networks: &id006
    - app
    ports:
    - 127.0.0.1:18110:8000
    mem_limit: 768m
    command:
    - sh
    - -ec
    - python -m app.cli init-db && exec uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*" --no-server-header
    depends_on:
      queue:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,json; h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)); assert h['status']=='ok'
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
  worker:
    security_opt: *id002
    cap_drop: *id003
    init: true
    restart: unless-stopped
    logging: *id001
    build: *id004
    image: linkdownloader-backend:78e4ea79
    pull_policy: build
    environment:
      APP_ENV: production
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.db
      REDIS_URL: redis://queue:6379/0
      ALLOWED_ORIGINS: https://linkdownloader.org,https://www.linkdownloader.org
      SESSION_COOKIE_SECURE: 'true'
      USE_X_ACCEL_REDIRECT: 'false'
      YTDLP_JS_RUNTIMES: node
      WORKER_INSTANCE: guest
    volumes: *id005
    networks: *id006
    depends_on: &id007
      api:
        condition: service_healthy
    mem_limit: 1250m
    cpus: 1
    command:
    - python
    - /srv/worker/run_worker.py
  owner:
    security_opt: *id002
    cap_drop: *id003
    init: true
    restart: unless-stopped
    logging: *id001
    build: *id004
    image: linkdownloader-backend:78e4ea79
    pull_policy: build
    environment:
      APP_ENV: production
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.db
      REDIS_URL: redis://queue:6379/0
      ALLOWED_ORIGINS: https://linkdownloader.org,https://www.linkdownloader.org
      SESSION_COOKIE_SECURE: 'true'
      USE_X_ACCEL_REDIRECT: 'false'
      YTDLP_JS_RUNTIMES: node
      WORKER_INSTANCE: owner
    volumes: *id005
    networks: *id006
    depends_on: *id007
    mem_limit: 1250m
    cpus: 1
    command:
    - python
    - /srv/worker/run_worker.py
  cleanup:
    security_opt: *id002
    cap_drop: *id003
    init: true
    restart: unless-stopped
    logging: *id001
    build: *id004
    image: linkdownloader-backend:78e4ea79
    pull_policy: build
    environment: *id008
    volumes: *id005
    networks: *id006
    depends_on: *id007
    mem_limit: 192m
    command:
    - sh
    - -ec
    - while true; do python -m app.cli cleanup; sleep 300; done
  web:
    security_opt: *id002
    cap_drop: *id003
    init: true
    restart: unless-stopped
    logging: *id001
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-bookworm-slim AS build
        WORKDIR /srv
        RUN echo '' | base64 -d | tar -xz -C /srv
        WORKDIR /srv/frontend
        ENV NEXT_TELEMETRY_DISABLED=1
        RUN npm ci --no-audit --no-fund && npm run build
        FROM node:24-bookworm-slim
        WORKDIR /srv/frontend
        ENV NODE_ENV=production HOSTNAME=0.0.0.0 PORT=3000 NEXT_TELEMETRY_DISABLED=1
        COPY --from=build --chown=node:node /srv/frontend/.next/standalone/ ./
        COPY --from=build --chown=node:node /srv/frontend/.next/static/ ./.next/static/
        COPY --from=build --chown=node:node /srv/frontend/public/ ./public/
        COPY --from=build /srv/activate-domain.sh /usr/local/share/linkdownloader/activate-domain.sh
        USER node
        CMD ["node","server.js"]
    container_name: linkdownloader-web
    ports:
    - 127.0.0.1:13110:3000
    mem_limit: 512m
    networks:
    - app
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
volumes:
  media: {}
  queue: {}
networks:
  app: {}
